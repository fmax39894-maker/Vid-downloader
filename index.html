<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>3D Model Viewer</h1>

    <input
        type="text"
        id="search"
        placeholder="Search model..."
    >
</header>

<main id="modelList">

<div class="card" data-model="raushan">
    <img src="thumbs/heart.jpg" alt="">
    <h3>Human Heart</h3>

    <button onclick="openModel('heart')">
        Open
    </button>
</div>

    <img src="thumbs/brain.jpg" alt="">

    </button>
</div>

</main>

<script src="app.js"></script>

</body>
