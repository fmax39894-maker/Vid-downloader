<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>3D Model Viewer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#111;
}

#topbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#1b1b1b;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
z-index:1000;
box-shadow:0 2px 10px rgba(0,0,0,.4);
}

#modelName{
color:#fff;
font-size:20px;
font-weight:bold;
}

button{
background:#0d6efd;
color:#fff;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#0b5ed7;
}

#viewer{
position:absolute;
top:60px;
left:0;
width:100%;
height:calc(100% - 60px);
}

canvas{
display:block;
}

</style>

</head>

<body>

<div id="topbar">

<button onclick="history.back()">
⬅ Back
</button>

<div id="modelName">
Loading...
</div>

<button id="downloadBtn">
⬇ Download
</button>

</div>

<div id="viewer"></div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- OBJ Loader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<!-- Viewer -->
<script src="viewer.js"></script>

</body>
</html>
