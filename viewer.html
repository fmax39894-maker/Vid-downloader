<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>3D Model Viewer</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#111;
font-family:Arial,Helvetica,sans-serif;
}

#topbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#1b1b1b;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
box-sizing:border-box;
z-index:1000;
box-shadow:0 2px 10px rgba(0,0,0,.4);
}

#modelName{
color:#fff;
font-size:20px;
font-weight:bold;
}

button{
background:#0d6efd;
border:none;
color:#fff;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#0b5ed7;
}

#viewer{
position:absolute;
top:60px;
left:0;
width:100%;
height:calc(100% - 60px);
}

canvas{
display:block;
}

</style>

</head>

<body>

<div id="topbar">

<button onclick="history.back()">
⬅ Back
</button>

<div id="modelName">
Loading...
</div>

<button id="downloadBtn">
⬇ Download
</button>

</div>

<div id="viewer"></div>

<script type="module" src="viewer.js"></script>

</body>
</html>
